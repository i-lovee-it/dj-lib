<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>첫 번째 단서</title>

<style>

body{
    margin:0;
    padding:0;
    background:#fdf7ff;
    text-align:center;
}

.container{
    position:relative;
    max-width:600px;
    margin:auto;
}

.main-image{
    width:100%;
    display:block;
}

/* 정답 입력칸 */
.answer-input{
    position:absolute;

    left:16%;
    bottom:5.8%;

    width:68%;
    height:4.8%;

    border:none;
    outline:none;

    background:transparent;

    text-align:center;

    font-size:24px;
    font-weight:bold;
    color:#7a4a4a;
}

/* 모바일 */
@media(max-width:600px){

.answer-input{
    font-size:20px;
}

}

</style>
</head>

<body>

<div class="container">

    <img src="images/stage1.png"
         class="main-image"
         alt="첫 번째 단서">

    <input
        type="text"
        id="answer"
        class="answer-input"
        placeholder=""
        autocomplete="off">

</div>

<script>

document.getElementById("answer")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        let answer =
        this.value
        .replace(/\s/g,"")
        .toLowerCase();

        if(
            answer === "어린이자료실" ||
            answer === "어린이자료실입니다" ||
            answer === "어린이"
        ){
            location.href="stage2.html";
        }
        else{
            alert("다시 생각해보세요!");
        }

    }

});

</script>

</body>
</html>
