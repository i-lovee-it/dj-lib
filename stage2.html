<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>두 번째 단서</title>

<style>
body{
    margin:0;
    padding:0;
    background:#fff7fb;
    text-align:center;
    font-family:'Pretendard', sans-serif;
}

.container{
    position:relative;
    max-width:600px;
    margin:auto;
}

.main-image{
    width:100%;
    display:block;
}

/* 이미지 속 입력칸 위치 */
.answer-input{
    position:absolute;

    /* 필요하면 여기 숫자만 조정 */
    bottom:35px;
    left:50%;
    transform:translateX(-50%);

    width:70%;
    height:52px;

    border:none;
    outline:none;

    background:transparent;

    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#d95b96;
}

.answer-input::placeholder{
    color:#f2a8c7;
}
</style>
</head>

<body>

<div class="container">

    <img src="images/stage2.png"
         class="main-image"
         alt="두 번째 단서">

    <input
        type="text"
        id="answer"
        class="answer-input"
        placeholder=""
        autocomplete="off">

</div>

<script>
document.getElementById("answer").addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        let answer = this.value
            .replace(/\s/g,"")
            .toLowerCase();

        if(
            answer === "토끼"
        ){
            location.href="stage3.html";
        }else{
            alert("앗! 다시 생각해보세요 🧚");
        }
    }

});
</script>

</body>
</html>
