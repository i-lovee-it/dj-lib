<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>두 번째 단서</title>

<style>
body{
    font-family:'맑은 고딕';
    background:#fff8f2;
    padding:20px;
}
.card{
    background:white;
    max-width:450px;
    margin:auto;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#ff8a65;
    color:white;
}
</style>

<script>
function checkAnswer(){

let answer =
document.getElementById("answer")
.value
.replace(/\s/g,"");

if(answer=="토끼"){
    location.href="stage3.html";
}
else{
    alert("다시 생각해보세요!");
}

}
</script>

</head>

<body>

<div class="card">

<h2>🐰 두 번째 단서</h2>

<p style="font-size:90px;">🐰</p>

<p>
사진 속 동물은 무엇일까요?
</p>

<input id="answer" placeholder="정답 입력">

<button onclick="checkAnswer()">
확인
</button>

</div>

</body>
</html>
