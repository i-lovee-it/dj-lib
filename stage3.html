<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>세 번째 단서</title>

<style>
body{
    margin:0;
    padding:0;
    background:#fff7fb;
    text-align:center;
}

.container{
    position:relative;
    max-width:600px;
    margin:auto;
}

.main-image{
    width:100%;
    display:block;
}

.answer-input{
    position:absolute;

    /* 입력칸 위치 */
    bottom:35px;
    left:50%;
    transform:translateX(-50%);

    width:65%;
    height:50px;

    border:none;
    outline:none;

    background:transparent;

    font-size:24px;
    text-align:center;
    color:#7a3f5d;
    font-weight:bold;
}

.answer-input::placeholder{
    color:#d8a8bd;
}

</style>
</head>

<body>

<div class="container">

    <img src="images/stage3.png"
         class="main-image"
         alt="세 번째 단서">

    <input
        type="text"
        class="answer-input"
        id="answer"
        placeholder=""
        onkeypress="checkAnswer(event)">
</div>

<script>

function checkAnswer(event){

    if(event.key === "Enter"){

        let answer = document
            .getElementById("answer")
            .value
            .replace(/\s/g,"")
            .toLowerCase();

        if(
            answer === "회원증" ||
            answer === "회원카드"
        ){
            location.href="stage4.html";
        }
        else{
            alert("앗! 다시 생각해보자!");
        }
    }
}

</script>

</body>
</html>
