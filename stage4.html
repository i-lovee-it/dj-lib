<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>네 번째 단서</title>

<style>

body{
    margin:0;
    padding:0;
    background:#000;
    text-align:center;
}

.poster-wrap{
    position:relative;
    width:100%;
    max-width:600px;
    margin:auto;
}

.poster{
    width:100%;
    display:block;
}

.answer-input{
    position:absolute;

    bottom:3.8%;
    left:50%;
    transform:translateX(-50%);

    width:68%;
    height:48px;

    border:none;
    outline:none;

    background:transparent;

    font-size:22px;
    font-weight:bold;
    text-align:center;

    color:#444;

    border-radius:12px;
}

</style>
</head>

<body>

<div class="poster-wrap">

    <img src="images/stage4.png"
         class="poster"
         alt="네 번째 단서">

    <input
        type="text"
        id="answer"
        class="answer-input">

</div>

<script>

const input = document.getElementById("answer");

let wrongCount = 0;

input.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        let answer = input.value
            .trim()
            .replaceAll(" ","");

        if(
            answer === "자연과학" ||
            answer === "400" ||
            answer === "400번대"
        ){

            location.href = "success.html";

        }else{

            wrongCount++;

            if(wrongCount === 1){

                alert("다시 생각해보자!");

            }
            else if(wrongCount === 2){

                alert("📚 힌트!\n\n자연과학은 몇 번일까?");

            }
            else{

                alert("📚 추가 힌트!\n\n자연과학은 400번대에 있어!");

            }

            input.value = "";
        }
    }

});

</script>

</body>
</html>
