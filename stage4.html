<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>네 번째 단서</title>

<style>

body{
    margin:0;
    padding:0;
    background:#000;
    text-align:center;
}

.poster-wrap{
    position:relative;
    width:100%;
    max-width:600px;
    margin:auto;
}

.poster{
    width:100%;
    display:block;
}

.answer-input{
    position:absolute;

    bottom:3.8%;
    left:50%;
    transform:translateX(-50%);

    width:68%;
    height:48px;

    border:none;
    outline:none;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(3px);

    border-radius:12px;

    font-size:22px;
    text-align:center;

    color:#444;
}

.answer-input::placeholder{
    color:#999;
}

</style>
</head>

<body>

<div class="poster-wrap">

    <img src="images/stage4.png"
         class="poster"
         alt="네 번째 단서">

    <input
        type="text"
        id="answer"
        class="answer-input"
        placeholder="정답 입력">

</div>

<script>

const input = document.getElementById("answer");

input.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        let answer = input.value
            .trim()
            .replaceAll(" ","");

        if(
            answer === "자연과학" ||
            answer === "400" ||
            answer === "400번대"
        ){
            location.href="success.html";
        }else{
            alert("다시 생각해보자!");
        }
    }

});

</script>

</body>
</html>
