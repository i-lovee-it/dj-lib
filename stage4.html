<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>마지막 단서</title>

<style>
body{
    font-family:'맑은 고딕';
    background:#eef7ff;
    padding:20px;
}
.card{
    background:white;
    max-width:450px;
    margin:auto;
    border-radius:20px;
    padding:25px;
    text-align:center;
}
input{
    width:100%;
    padding:15px;
    margin-top:15px;
}
button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#2196f3;
    color:white;
    border:none;
    border-radius:10px;
}
</style>

<script>
function checkAnswer(){

let answer =
document.getElementById("answer")
.value
.replace(/\s/g,"");

if(answer=="400"){
    location.href="success.html";
}
else{
    alert("힌트 : 자연과학!");
}

}
</script>

</head>

<body>

<div class="card">

<h2>🔢 마지막 단서</h2>

<p style="font-size:90px;">🦖🦋🌳</p>

<p>
동물, 식물, 공룡 책이 있는 곳은 몇 백번대일까요?
</p>

<input id="answer">

<button onclick="checkAnswer()">
확인
</button>

</div>

</body>
</html>
