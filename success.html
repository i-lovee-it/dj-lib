<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>책요정을 찾았어요!</title>

<style>

body{
    margin:0;
    padding:0;
    background:#fdf7ff;
    text-align:center;
}

.container{
    position:relative;
    max-width:600px;
    margin:auto;
}

.success-image{
    width:100%;
    display:block;
}

/* 선물 받으러 가기 클릭영역 */
.next-area{
    position:absolute;

    left:18%;
    width:64%;

    bottom:4%;
    height:8%;

    cursor:pointer;

    background:rgba(255,0,0,0);
}

</style>
</head>

<body>

<div class="container">

    <img src="images/success.png"
         class="success-image"
         alt="책요정 발견">

    <div class="next-area"
         onclick="location.href='ending.html'">
    </div>

</div>

</body>
</html>
